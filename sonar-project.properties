# Configuration SonarQube pour le projet ProjetStage
sonar.projectKey=tp-global-devops
sonar.projectName=TP Global DevOps Pipeline
sonar.projectVersion=1.0

# Chemins des sources et des tests
sonar.sources=src/main/java
sonar.tests=src/test/java

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Chemins des rapports de couverture
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions (fichiers à ignorer)
sonar.exclusions=**/test/**,**/target/**,**/*.xml